name: build-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 恢复
        run: dotnet restore .\MVoxel.sln
      - name: 构建
        run: dotnet build .\MVoxel.sln --no-restore -m:1
      - name: 回归测试
        run: dotnet run --project .\MVoxel.Tests\MVoxel.Tests.csproj --no-build
      - name: 文档链接检查
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\Scripts\Test-Docs.ps1
