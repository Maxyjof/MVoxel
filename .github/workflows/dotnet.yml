name: 构建与测试

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 恢复依赖
        run: dotnet restore .\MVoxel.sln

      - name: 构建解决方案
        run: dotnet build .\MVoxel.sln --no-restore --configuration Release -m:1

      - name: 执行回归测试
        run: dotnet run --project .\MVoxel.Tests\MVoxel.Tests.csproj --no-build --configuration Release
