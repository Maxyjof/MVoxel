<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100">
  <title>MVoxel grid logo</title>
  <desc>Uppercase M made from non-overlapping equal-size voxel modules on a transparent background.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283A52"/>
      <stop offset="0.48" stop-color="#111C2B"/>
      <stop offset="1" stop-color="#070D17"/>
    </linearGradient>
    <linearGradient id="plateEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#435A76"/>
      <stop offset="0.35" stop-color="#1C2B40"/>
      <stop offset="1" stop-color="#080F1B"/>
    </linearGradient>
    <linearGradient id="blueVoxelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CE4FF"/>
      <stop offset="0.16" stop-color="#42A5F5"/>
      <stop offset="0.62" stop-color="#1976D2"/>
      <stop offset="1" stop-color="#0B3E86"/>
    </linearGradient>
    <linearGradient id="redVoxelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A8D"/>
      <stop offset="0.16" stop-color="#EF5350"/>
      <stop offset="0.62" stop-color="#D32F2F"/>
      <stop offset="1" stop-color="#771822"/>
    </linearGradient>
    <pattern id="plateGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="52" height="52" fill="url(#plate)" stroke="#354963" stroke-width="2"/>
      <rect x="3" y="3" width="46" height="3" fill="#9BB5D1" opacity="0.18"/>
      <rect x="3" y="47" width="46" height="2" fill="#020611" opacity="0.6"/>
    </pattern>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="9" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
    <filter id="voxelShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="5" dy="8" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.82"/>
    </filter>
    <filter id="plateTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.52  0 0 0 0 0.64  0 0 0 0.18 0"/>
    </filter>
    <g id="blueVoxel">
      <rect width="52" height="52" fill="url(#blueVoxelGradient)" stroke="#0D56A7" stroke-width="2"/>
      <rect x="4" y="4" width="44" height="4" fill="#D4F7FF" opacity="0.42"/>
      <rect x="4" y="44" width="44" height="3" fill="#041F58" opacity="0.52"/>
      <rect x="4" y="8" width="3" height="36" fill="#B8F0FF" opacity="0.18"/>
    </g>
    <g id="redVoxel">
      <rect width="52" height="52" fill="url(#redVoxelGradient)" stroke="#A8202A" stroke-width="2"/>
      <rect x="4" y="4" width="44" height="4" fill="#FFE0D9" opacity="0.42"/>
      <rect x="4" y="44" width="44" height="3" fill="#4A0912" opacity="0.52"/>
      <rect x="4" y="8" width="3" height="36" fill="#FFD0C7" opacity="0.18"/>
    </g>
  </defs>

  <!-- The exterior is intentionally empty: this file has a transparent background. -->
  <rect x="92" y="108" width="916" height="896" fill="#02050B" opacity="0.88" filter="url(#plateShadow)"/>
  <rect x="102" y="102" width="896" height="896" fill="url(#plateEdge)" stroke="#4F6781" stroke-width="3"/>
  <rect x="102" y="102" width="896" height="896" fill="url(#plateGrid)"/>
  <rect x="102" y="102" width="896" height="896" fill="none" stroke="#5C7692" stroke-width="4"/>

  <!-- Every M module is 52x52 and has a unique integer grid position. -->
  <g filter="url(#voxelShadow)">
    <!-- row 0 -->
    <use href="#blueVoxel" x="254" y="254"/>
    <use href="#redVoxel" x="794" y="254"/>
    <!-- row 1 -->
    <use href="#blueVoxel" x="254" y="314"/>
    <use href="#blueVoxel" x="314" y="314"/>
    <use href="#redVoxel" x="734" y="314"/>
    <use href="#redVoxel" x="794" y="314"/>
    <!-- row 2 -->
    <use href="#blueVoxel" x="254" y="374"/>
    <use href="#blueVoxel" x="374" y="374"/>
    <use href="#redVoxel" x="674" y="374"/>
    <use href="#redVoxel" x="794" y="374"/>
    <!-- row 3 -->
    <use href="#blueVoxel" x="254" y="434"/>
    <use href="#blueVoxel" x="434" y="434"/>
    <use href="#redVoxel" x="614" y="434"/>
    <use href="#redVoxel" x="794" y="434"/>
    <!-- row 4: the center is exactly one blue module beside one red module -->
    <use href="#blueVoxel" x="254" y="494"/>
    <use href="#blueVoxel" x="494" y="494"/>
    <use href="#redVoxel" x="554" y="494"/>
    <use href="#redVoxel" x="794" y="494"/>
    <!-- rows 5 to 9: two vertical stems -->
    <use href="#blueVoxel" x="254" y="554"/>
    <use href="#redVoxel" x="794" y="554"/>
    <use href="#blueVoxel" x="254" y="614"/>
    <use href="#redVoxel" x="794" y="614"/>
    <use href="#blueVoxel" x="254" y="674"/>
    <use href="#redVoxel" x="794" y="674"/>
    <use href="#blueVoxel" x="254" y="734"/>
    <use href="#redVoxel" x="794" y="734"/>
    <use href="#blueVoxel" x="254" y="794"/>
    <use href="#redVoxel" x="794" y="794"/>
  </g>
</svg>
